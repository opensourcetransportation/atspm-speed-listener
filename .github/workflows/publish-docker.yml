name: Publish Docker Container

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: |
          latest=false
        tags: |
          # Tag with exact SemVer version (e.g. 1.2.3 or 1.2.3-rc1)
          type=semver,pattern={{version}}
          # Tag with 'latest' only if the Git tag does not contain a hyphen (stable release)
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          # Tag with 'pre-release' if the Git tag contains a hyphen (e.g. contains -rc)
          type=raw,value=pre-release,enable=${{ contains(github.ref_name, '-') }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./SpeedListener
        file: ./SpeedListener/SpeedListener/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
