name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deployment-scripts:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Test upgrade and rollback without controlling real services
      shell: ${{ matrix.shell }}
      run: |
        ./deploy/tests/Upgrade-Service.Tests.ps1
        ./deploy/tests/Test-ServiceSwitchover.Tests.ps1

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore Dependencies
      run: dotnet restore SpeedListener/SpeedListener.sln

    - name: Build Solution
      run: dotnet build SpeedListener/SpeedListener.sln --configuration Release --no-restore

    - name: Run xUnit Tests
      run: dotnet test SpeedListener/SpeedListener.sln --configuration Release --no-build --verbosity normal
